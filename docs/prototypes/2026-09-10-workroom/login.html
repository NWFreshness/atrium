<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Atrium</title>
<script>(function(){try{var t=localStorage.getItem("atrium.theme");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/workroom.css">
<style>
  .login-stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
  }
  .login-mark {
    position: absolute;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: min(46vh, 46vw, 560px);
    line-height: 1;
    color: var(--brass);
    opacity: 0.045;
    user-select: none;
    pointer-events: none;
  }
  .login-card {
    position: relative;
    width: min(400px, 92vw);
    padding: 2.4rem 2.5rem 2.1rem;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-panel), var(--glow-brass);
  }
  .login-card .brandrow {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .login-card h1 {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .login-card .tag {
    margin-top: 0.5rem;
    font-size: 13.5px;
    color: var(--ink-dim);
  }
  .login-card form {
    margin-top: 1.9rem;
  }
  .login-card .foot {
    margin-top: 1.6rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<div class="login-stage">
  <div class="login-mark" aria-hidden="true">A</div>
  <div class="login-card reveal">
    <div class="brandrow">
      <span class="brand"><span class="mark"></span></span>
      <h1>Atrium</h1>
    </div>
    <p class="tag">Four personal apps, one login.</p>
    <form onsubmit="event.preventDefault(); location.href='index.html';">
      <label class="field">
        <span>Email</span>
        <input type="email" autocomplete="username" placeholder="you@atrium.local">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" autocomplete="current-password" placeholder="••••••••">
      </label>
      <button class="btn btn-primary" type="submit" style="width:100%; margin-top:.4rem; padding:11px 16px; font-size:13.5px;">
        Sign in
      </button>
    </form>
    <div class="foot">
      <span>Two accounts · no signup</span>
      <span>v1 · 2026</span>
    </div>
  </div>
</div>
</body>
</html>
